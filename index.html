<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GCOEN Campus Assistant</title>
<style>
body{font-family:Arial;background:#e9eef5;margin:0}
.header{background:#1f4e79;color:white;padding:15px;text-align:center}
.chat{max-width:800px;margin:20px auto;background:white;border-radius:12px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#messages{height:400px;overflow:auto;border:1px solid #ddd;padding:10px;border-radius:8px}
.msg{margin:8px 0}
.bot{color:#1f4e79}.user{color:#0a7d31}
input{width:78%;padding:10px} button{padding:10px}
</style>
</head>
<body>
<div class="header"><h2>GCOEN Campus Assistant - By Jagesh Rana</h2></div>
<div class="chat">
<div id="messages"><div class="msg bot"><b>Bot:</b> Welcome! Ask about admission, departments, placements, events or contact.</div></div>
<input id="q" placeholder="Type your question...">
<button onclick="send()">Send</button>
</div>
<script>
function send(){
let q=document.getElementById('q').value.toLowerCase();
let m=document.getElementById('messages');
m.innerHTML+=`<div class='msg user'><b>User:</b> ${q}</div>`;
let a="Sorry, I can only answer campus-related questions.";
if(q.includes('admission')) a="Admissions are conducted through MHT-CET and CAP rounds.";
else if(q.includes('department')) a="ETC, CSE, Mechanical, Electrical and Civil departments are available.";
else if(q.includes('placement')) a="The Training & Placement Cell manages recruitment and internships.";
else if(q.includes('event')) a="The college organizes workshops, technical events and exhibitions.";
else if(q.includes('contact')) a="Please contact the college office for assistance.";
m.innerHTML+=`<div class='msg bot'><b>Bot:</b> ${a}</div>`;
document.getElementById('q').value='';
m.scrollTop=m.scrollHeight;
}
</script>
</body>
</html>
